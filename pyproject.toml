[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ezergo-overlay"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "PySide6>=6.6",
  "hidapi>=0.15.0",
]

[project.optional-dependencies]
build = [
  "pyinstaller>=6.0",
]
# 安裝 vial 可選依賴以啟用完整的鍵碼標籤功能（使用 vial-gui 的 Keycode 類）
# 如果不安裝，將回退到顯示十六進制鍵碼
vial = [
  "simpleeval",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]


