[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ezergo-overlay"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "PySide6>=6.6",
  "hidapi>=0.15.0",
]

[project.optional-dependencies]
build = [
  "pyinstaller>=6.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]


